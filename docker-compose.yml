# PARALLEL/CUTOVER CANDIDATE ONLY.
# This starts another Mattermost process against the production database and
# shared writable Mattermost volumes. Do not run it while the existing
# Mattermost service is active without a reviewed multi-node/maintenance plan.
# It does not deploy or replace anything automatically; it has no Traefik route.
name: devops-playground-chatmattermostsukses-sewtr3-custom

services:
  mattermost:
    image: mattermost-custom:10.12.4-cutover
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile.custom
      args:
        MATTERMOST_VERSION: "10.12.4"
        SOURCE_REVISION: 463e0d0d3930782d3c975da26c991dcbfccd751c
        BUILD_DATE: 2025-11-21T13:22:45Z
    restart: unless-stopped
    environment:
      MM_SERVICESETTINGS_SITEURL: ${MM_SERVICESETTINGS_SITEURL:?Set the existing Mattermost site URL}
      MM_SQLSETTINGS_DRIVERNAME: postgres
      MM_SQLSETTINGS_DATASOURCE: "${MM_SQLSETTINGS_DATASOURCE:?Set the existing PostgreSQL DSN for host postgres and database mattermost}"
      MM_SERVICESETTINGS_ENABLELOCALMODE: "true"
    ports:
      - "8066:8065"
    volumes:
      - mattermost_config:/mattermost/config
      - mattermost_data:/mattermost/data
      - mattermost_logs:/mattermost/logs
      - mattermost_plugins:/mattermost/plugins
      - mattermost_client_plugins:/mattermost/client/plugins
      - mattermost_bleve:/mattermost/bleve-indexes
    networks:
      - production

volumes:
  mattermost_config:
    external: true
    name: devops-playground-chatmattermostsukses-sewtr3_mattermost_config
  mattermost_data:
    external: true
    name: devops-playground-chatmattermostsukses-sewtr3_mattermost_data
  mattermost_logs:
    external: true
    name: devops-playground-chatmattermostsukses-sewtr3_mattermost_logs
  mattermost_plugins:
    external: true
    name: devops-playground-chatmattermostsukses-sewtr3_mattermost_plugins
  mattermost_client_plugins:
    external: true
    name: devops-playground-chatmattermostsukses-sewtr3_mattermost_client_plugins
  mattermost_bleve:
    external: true
    name: devops-playground-chatmattermostsukses-sewtr3_mattermost_bleve

networks:
  production:
    external: true
    name: devops-playground-chatmattermostsukses-sewtr3_default
